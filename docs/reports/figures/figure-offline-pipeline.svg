<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">Offline preparation and model pipeline</title>
  <desc id="desc">A simplified offline pipeline from raw catalog data to deployable retrieval artifacts.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,8 L11,4 z" fill="#243041"/></marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,8 L11,4 z" fill="#2d6fb7"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.12"/></filter>
    <style>
      .heading{font:700 34px 'Times New Roman',serif;fill:#111827}.phase{font:700 21px 'Times New Roman',serif;fill:#2d6fb7;letter-spacing:1px}.title{font:700 25px 'Times New Roman',serif;fill:#111827}.body{font:400 21px 'Times New Roman',serif;fill:#374151}.file{font:italic 19px 'Times New Roman',serif;fill:#4b5563}.input{fill:#f5f9ff;stroke:#6b9ed6;stroke-width:2.5;rx:14}.process{fill:#fff;stroke:#2d6fb7;stroke-width:2.8;rx:14;filter:url(#shadow)}.report{fill:#f4f5f7;stroke:#8b95a5;stroke-width:2.3;rx:14}.output{fill:#fff7e5;stroke:#d28a00;stroke-width:2.8;rx:14;filter:url(#shadow)}.line{fill:none;stroke:#243041;stroke-width:2.8;marker-end:url(#arrow)}.data{fill:none;stroke:#2d6fb7;stroke-width:3;marker-end:url(#arrowBlue)}.dash{fill:none;stroke:#667085;stroke-width:2.4;stroke-dasharray:9 7;marker-end:url(#arrow)}
    </style>
  </defs>
  <text x="60" y="55" class="heading">Offline Preparation and Model Pipeline</text>
  <text x="60" y="100" class="phase">1 · PREPARE THE CATALOG</text>
  <rect x="60" y="135" width="250" height="115" class="input"/><text x="185" y="177" text-anchor="middle" class="title">Raw metadata</text><text x="185" y="215" text-anchor="middle" class="file">data/data.csv</text>
  <rect x="60" y="280" width="250" height="115" class="input"/><text x="185" y="322" text-anchor="middle" class="title">Product images</text><text x="185" y="360" text-anchor="middle" class="file">data/data/</text>
  <rect x="395" y="170" width="330" height="190" class="process"/><text x="560" y="215" text-anchor="middle" class="title">Data preparation</text><text x="560" y="252" text-anchor="middle" class="body">Validate and normalize data</text><text x="560" y="286" text-anchor="middle" class="body">Remove exact duplicate images</text><text x="560" y="320" text-anchor="middle" class="body">Sample the configured catalog</text><text x="560" y="347" text-anchor="middle" class="file">prepare_dataset.py</text>
  <rect x="820" y="205" width="285" height="120" class="output"/><text x="962" y="250" text-anchor="middle" class="title">Processed catalog</text><text x="962" y="291" text-anchor="middle" class="file">products.csv</text>
  <path d="M310 192 H355 V230 H395" class="line"/><path d="M310 337 H355 V300 H395" class="line"/><path d="M725 265 H820" class="data"/>
  <rect x="1195" y="135" width="245" height="115" class="report"/><text x="1317" y="177" text-anchor="middle" class="title">Category audit</text><text x="1317" y="211" text-anchor="middle" class="body">Report and warnings</text><path d="M1105 235 H1150 V192 H1195" class="dash"/>
  <rect x="1195" y="280" width="245" height="115" class="process"/><text x="1317" y="322" text-anchor="middle" class="title">Dataset split</text><text x="1317" y="356" text-anchor="middle" class="body">Train · validation · test</text><path d="M1105 290 H1150 V337 H1195" class="data"/>
  <text x="60" y="438" class="phase">2 - BUILD MODEL AND RETRIEVAL ARTIFACTS</text>
  <rect x="60" y="500" width="330" height="160" class="process"/><text x="225" y="544" text-anchor="middle" class="title">Fine-tune CLIP</text><text x="225" y="581" text-anchor="middle" class="body">Train on fashion image-text pairs</text><text x="225" y="615" text-anchor="middle" class="body">Select best validation checkpoint</text><text x="225" y="646" text-anchor="middle" class="file">runs/clip_finetune/best</text><path d="M1317 395 V475 H225 V500" class="data"/>
  <rect x="470" y="500" width="405" height="160" class="process"/><text x="672" y="542" text-anchor="middle" class="title">Generate retrieval artifacts</text><text x="672" y="579" text-anchor="middle" class="body">CLIP image and text embeddings</text><text x="672" y="613" text-anchor="middle" class="body">TF-IDF metadata index</text><text x="672" y="647" text-anchor="middle" class="body">Category prompt embeddings</text><path d="M390 580 H470" class="data"/><path d="M962 325 V475 H672 V500" class="data"/>
  <rect x="955" y="500" width="350" height="160" class="process"/><text x="1130" y="544" text-anchor="middle" class="title">Validation weight selection</text><text x="1130" y="581" text-anchor="middle" class="body">Evaluate candidate retrieval weights</text><text x="1130" y="615" text-anchor="middle" class="body">Do not tune on test data</text><text x="1130" y="646" text-anchor="middle" class="file">retrieval_weights.json</text><path d="M875 580 H955" class="data"/>
  <text x="60" y="720" class="phase">3 - DEPLOY THE SELECTED ARTIFACT BUNDLE</text>
  <rect x="235" y="750" width="1030" height="125" class="output"/>
  <text x="750" y="790" text-anchor="middle" class="title">Selected runtime artifact bundle</text>
  <text x="750" y="825" text-anchor="middle" class="body">Catalog - checkpoint - embeddings - TF-IDF index</text>
  <text x="750" y="858" text-anchor="middle" class="body">Category prompts - retrieval weights</text>
  <path d="M1130 660 V705 H750 V750" class="data"/>
</svg>
