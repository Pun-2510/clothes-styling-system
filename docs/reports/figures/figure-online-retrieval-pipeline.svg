<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="990" viewBox="0 0 1500 990" role="img" aria-labelledby="title desc">
  <title id="title">Online retrieval pipeline</title>
  <desc id="desc">A simplified online pipeline with separate image-only, text-only and combined query routes.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,8 L11,4 z" fill="#243041"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.12"/></filter>
    <style>
      .heading{font:700 34px 'Times New Roman',serif;fill:#111827}.title{font:700 24px 'Times New Roman',serif;fill:#111827}.body{font:400 20px 'Times New Roman',serif;fill:#374151}.small{font:400 18px 'Times New Roman',serif;fill:#4b5563}.infra{fill:#f5f9ff;stroke:#6b9ed6;stroke-width:2.5;rx:13}.lane1{fill:#f3f7fd;stroke:#5d8fc7;stroke-width:2.3;rx:15}.lane2{fill:#f7f5fb;stroke:#8d86bd;stroke-width:2.3;rx:15}.lane3{fill:#fff8e8;stroke:#d28a00;stroke-width:2.3;rx:15}.box{fill:#fff;stroke:#aeb7c4;stroke-width:2.3;rx:12}.policy{fill:#fff3cf;stroke:#d28a00;stroke-width:2.5;rx:12}.output{fill:#243041;stroke:#111827;stroke-width:2.5;rx:13;filter:url(#shadow)}.outTitle{font:700 24px 'Times New Roman',serif;fill:#fff}.outBody{font:400 19px 'Times New Roman',serif;fill:#e5e7eb}.artifact{fill:#f4f5f7;stroke:#8b95a5;stroke-width:2;stroke-dasharray:9 7;rx:12}.line{fill:none;stroke:#243041;stroke-width:2.8;marker-end:url(#arrow)}.join{fill:none;stroke:#243041;stroke-width:2.8}
    </style>
  </defs>
  <text x="50" y="52" class="heading">Online Retrieval Pipeline</text>
  <rect x="50" y="85" width="260" height="92" class="infra"/><text x="180" y="123" text-anchor="middle" class="title">React interface</text><text x="180" y="153" text-anchor="middle" class="small">image, text or both inputs</text>
  <rect x="370" y="85" width="250" height="92" class="infra"/><text x="495" y="123" text-anchor="middle" class="title">Nginx</text><text x="495" y="153" text-anchor="middle" class="small">proxy and load balancing</text>
  <rect x="680" y="85" width="270" height="92" class="infra"/><text x="815" y="123" text-anchor="middle" class="title">FastAPI backend</text><text x="815" y="153" text-anchor="middle" class="small">validate and route request</text>
  <rect x="1010" y="85" width="285" height="92" class="infra"/><text x="1152" y="123" text-anchor="middle" class="title">Automatic routing</text><text x="1152" y="153" text-anchor="middle" class="small">select one query route</text>
  <path d="M310 131 H370" class="line"/><path d="M620 131 H680" class="line"/><path d="M950 131 H1010" class="line"/>
  <rect x="50" y="220" width="1285" height="170" class="lane1"/><text x="75" y="257" class="title">A. Image-only</text>
  <rect x="75" y="280" width="245" height="80" class="box"/><text x="197" y="313" text-anchor="middle" class="title">Image / optional crop</text><text x="197" y="341" text-anchor="middle" class="small">target garment region</text>
  <rect x="370" y="280" width="245" height="80" class="box"/><text x="492" y="313" text-anchor="middle" class="title">Compare query image</text><text x="492" y="341" text-anchor="middle" class="small">CLIP embedding + cosine score</text>
  <rect x="665" y="270" width="350" height="100" class="policy"/><text x="840" y="306" text-anchor="middle" class="title">Dynamic category evidence</text><text x="840" y="337" text-anchor="middle" class="small">visual neighbours + prompts + confidence</text>
  <rect x="1065" y="280" width="245" height="80" class="box"/><text x="1187" y="313" text-anchor="middle" class="title">Final image score</text><text x="1187" y="341" text-anchor="middle" class="small">soft category support</text>
  <path d="M320 320 H370" class="line"/><path d="M615 320 H665" class="line"/><path d="M1015 320 H1065" class="line"/>
  <rect x="50" y="420" width="1285" height="170" class="lane2"/><text x="75" y="457" class="title">B. Text-only</text>
  <rect x="75" y="480" width="245" height="80" class="box"/><text x="197" y="513" text-anchor="middle" class="title">Text normalization</text><text x="197" y="541" text-anchor="middle" class="small">optional VI → EN</text>
  <rect x="370" y="480" width="245" height="80" class="box"/><text x="492" y="513" text-anchor="middle" class="title">Compare query text</text><text x="492" y="541" text-anchor="middle" class="small">cross-modal + text similarity</text>
  <rect x="665" y="470" width="350" height="100" class="policy"/><text x="840" y="506" text-anchor="middle" class="title">Text category policy</text><text x="840" y="537" text-anchor="middle" class="small">clear category constrains candidates</text>
  <rect x="1065" y="480" width="245" height="80" class="box"/><text x="1187" y="513" text-anchor="middle" class="title">TF-IDF refinement</text><text x="1187" y="541" text-anchor="middle" class="small">metadata support</text>
  <path d="M320 520 H370" class="line"/><path d="M615 520 H665" class="line"/><path d="M1015 520 H1065" class="line"/>
  <rect x="50" y="620" width="1285" height="170" class="lane3"/><text x="75" y="657" class="title">C. Combined image–text</text>
  <rect x="75" y="680" width="245" height="80" class="box"/><text x="197" y="713" text-anchor="middle" class="title">Encode both inputs</text><text x="197" y="741" text-anchor="middle" class="small">vision + text encoders</text>
  <rect x="370" y="680" width="245" height="80" class="box"/><text x="492" y="713" text-anchor="middle" class="title">Combine query scores</text><text x="492" y="741" text-anchor="middle" class="small">weighted raw cosine fusion</text>
  <rect x="665" y="670" width="350" height="100" class="policy"/><text x="840" y="706" text-anchor="middle" class="title">Category policy</text><text x="840" y="737" text-anchor="middle" class="small">explicit text category or image evidence</text>
  <rect x="1065" y="680" width="245" height="80" class="box"/><text x="1187" y="713" text-anchor="middle" class="title">Category-gated TF-IDF</text><text x="1187" y="741" text-anchor="middle" class="small">refine products allowed by policy</text>
  <path d="M320 720 H370" class="line"/><path d="M615 720 H665" class="line"/><path d="M1015 720 H1065" class="line"/>
  <path d="M1152 177 V200 H25 V320 H75" class="line"/><path d="M25 320 V520 H75" class="line"/><path d="M25 520 V720 H75" class="line"/>
  <path d="M1310 320 H1410 V815 H1172" class="join"/><path d="M1310 520 H1410" class="join"/><path d="M1310 720 H1410" class="join"/>
  <circle cx="1172" cy="815" r="6" fill="#243041"/>
  <path d="M1172 821 V860" class="line"/>
  <rect x="980" y="860" width="385" height="100" class="output"/><text x="1172" y="899" text-anchor="middle" class="outTitle">Rank eligible products</text><text x="1172" y="932" text-anchor="middle" class="outBody">return Top-K results and explanations</text>
  <rect x="50" y="865" width="825" height="90" class="artifact"/><text x="462" y="899" text-anchor="middle" class="title">Loaded runtime artifacts</text><text x="462" y="929" text-anchor="middle" class="small">catalog - checkpoint - embeddings - TF-IDF index - category prompts - relation graph - weights</text><path d="M875 910 H980" class="line"/>
</svg>
