# Public web reverse proxy. This is the only container that publishes a host
# port. Requests for the website go to Vite; API, image and documentation
# routes go to the internal API Gateway.
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 3s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream fashion_frontend {
    zone fashion_frontend 32k;
    server frontend:5173 resolve;
    keepalive 8;
}

upstream fashion_api_gateway {
    zone fashion_api_gateway 32k;
    server api-gateway:80 resolve;
    keepalive 8;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    client_max_body_size 6m;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_send_timeout 130s;
    proxy_read_timeout 130s;

    location = /proxy-health {
        access_log off;
        default_type text/plain;
        return 200 "web reverse proxy alive\n";
    }

    # API Gateway routes. Keeping them on the same public origin avoids CORS
    # configuration and gives the browser one stable entry point.
    location ^~ /api/ {
        proxy_pass http://fashion_api_gateway;
    }

    location ^~ /catalog-images/ {
        proxy_pass http://fashion_api_gateway;
    }

    location = /lb-health {
        proxy_pass http://fashion_api_gateway;
    }

    location = /openapi.json {
        proxy_pass http://fashion_api_gateway;
    }

    location ^~ /docs {
        proxy_pass http://fashion_api_gateway;
    }

    location ^~ /redoc {
        proxy_pass http://fashion_api_gateway;
    }

    # React/Vite website and development WebSocket/HMR traffic.
    location / {
        # proxy_set_header directives are not inherited when this location
        # defines its own Upgrade headers. Repeat the client headers here so
        # Vite receives "localhost" instead of the upstream name
        # "fashion_frontend" and can enforce its host allow-list normally.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://fashion_frontend;
    }
}
