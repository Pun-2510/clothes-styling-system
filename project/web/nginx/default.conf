# Included inside http. Docker DNS tracks container IP changes after recreation.
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 3s;

log_format upstream_timing '$remote_addr [$time_local] "$request" $status '
                           'upstream=$upstream_addr upstream_status=$upstream_status '
                           'request_time=$request_time upstream_time=$upstream_response_time';

upstream fashion_api {
    zone fashion_api 64k;
    least_conn;
    server backend:8000 resolve max_fails=1 fail_timeout=10s;
    server backend_2:8000 resolve max_fails=1 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    access_log /dev/stdout upstream_timing;
    error_log /dev/stderr warn;

    # API still enforces 5 MiB per image; allow multipart overhead here.
    client_max_body_size 6m;
    client_body_timeout 60s;
    proxy_request_buffering on;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 130s;

    # Local demo diagnostic. After retry this can contain both peer addresses.
    add_header X-Upstream-Addr $upstream_addr always;

    # Gateway liveness only, NOT model readiness.
    location = /lb-health {
        access_log off;
        default_type text/plain;
        return 200 "nginx alive\n";
    }

    # Only these read-only inference POSTs may be replayed. A timeout can cause
    # duplicate computation/logs. Never enable this globally for future writes.
    location = /api/recommendations/image {
        proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
        proxy_pass http://fashion_api;
    }
    location = /api/recommendations/text {
        proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
        proxy_pass http://fashion_api;
    }
    location / {
        proxy_pass http://fashion_api;
    }
}
