networks:
  app-network:
    driver: bridge

services:

  frontend:
    build:
      context: ./web/frontend
      dockerfile: Dockerfile
    volumes:
      - type: bind
        source: ./web/frontend
        target: /app
      - type: volume
        source: node_modules
        target: /app/node_modules
    ports:
      - 5173:5173
    environment:
      VITE_API_PROXY_TARGET: http://api-gateway:80
    depends_on:
      api-gateway:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  backend: &backend
    image: fashion-recommendation-backend:local
    build:
      context: .
      dockerfile: web/backend/Dockerfile
    environment: &backend-environment
      CLIP_MODEL_PATH: /app/runs/clip_finetune_3epochs_local/best
      CLIP_EMBEDDING_DIR: /app/embeddings
      CATEGORY_CONFIDENCE_THRESHOLD: ${CATEGORY_CONFIDENCE_THRESHOLD:-0.60}
      CATEGORY_TOP_PER_CLASS: ${CATEGORY_TOP_PER_CLASS:-3}
      HF_HOME: /cache/huggingface
      RECOMMENDATION_LOG_NAME: recommendation-backend.log
    volumes:
      - type: bind
        source: ./web/backend
        target: /app/web/backend
      - type: bind
        source: ./src
        target: /app/src
      - type: bind
        source: ${FASHION_IMAGE_DIR:-./data/data}
        target: /app/data/data
        read_only: true
      - type: bind
        source: ${FASHION_CATALOG_DIR:-./data/processed}
        target: /app/data/processed
        read_only: true
      - type: bind
        source: ${FASHION_EMBEDDINGS_DIR:-./embeddings}
        target: /app/embeddings
        read_only: true
      - type: bind
        source: ${FASHION_CHECKPOINT_DIR:-./runs/clip_finetune_3epochs_local/best}
        target: /app/runs/clip_finetune_3epochs_local/best
        read_only: true
      - type: bind
        source: ./logs
        target: /app/logs
      - type: volume
        source: huggingface_cache
        target: /cache/huggingface
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/api/health/ready', timeout=5)
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    restart: unless-stopped
    networks:
      - app-network

  backend_2:
    <<: *backend
    environment:
      <<: *backend-environment
      RECOMMENDATION_LOG_NAME: recommendation-backend_2.log

  api-gateway:
    # Dynamic upstream DNS requires Nginx >= 1.27.3.
    image: nginx:stable-alpine
    ports:
      - "8000:80"
    volumes:
      - type: bind
        source: ./web/api-gateway
        target: /etc/nginx/conf.d
        read_only: true
    depends_on:
      # One model failing to initialize must not block the entire gateway.
      backend:
        condition: service_started
      backend_2:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/lb-health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - app-network

volumes:
  node_modules:
  huggingface_cache:
